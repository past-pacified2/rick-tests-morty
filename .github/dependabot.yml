# Dependency versions are pinned exactly (ADR-0006), which means updates must arrive
# deliberately. Dependabot is how they arrive: as a reviewable diff with CI attached,
# rather than silently via a transitive patch release.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group the low-risk churn so review effort goes to the updates that matter.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    # Two majors are held back deliberately, and without this Dependabot re-proposes
    # them every Monday forever. Each entry is a decision with an expiry: delete it
    # once the blocking peer catches up, and the update arrives on the next run.
    ignore:
      # eslint-plugin-jsx-a11y peers cap at ^9, so ESLint 10 breaks the lint job.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # typescript-eslint peers at <6.1.0, so TypeScript 7 breaks type-aware linting.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node describes a Node major, so it tracks .nvmrc rather than npm. Ahead
      # of the runtime it silently type-checks calls to APIs the deployed Node does not
      # have — the one dependency where a green build proves nothing. Raise this with
      # .nvmrc and engines, in one commit, or not at all.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  # Actions are SHA-pinned (ADR-0006). Dependabot understands SHA pins and will
  # bump the hash while keeping the trailing `# vN` comment accurate — which is the
  # only practical way to keep pinned actions from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR for all routine action bumps rather than one per action. Reviewing five
    # separate SHA changes to checkout, setup-node and upload-artifact is five times the
    # ceremony for the same decision, and the CI run that validates them is identical.
    #
    # Majors are excluded, matching the npm groups above. A grouped major bump is a
    # single green check covering several independent breaking changes, and when one of
    # them misbehaves there is nothing to bisect. Arriving separately, each is its own
    # revert.
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
