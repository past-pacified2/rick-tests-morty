<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      %VITE_SITE_URL% is substituted by Vite at build time from the environment.
      If the variable is unset the placeholder survives verbatim into the output, and
      a canonical URL reading "%VITE_SITE_URL%/" is invisible in every test that does
      not look for it. It is set in CI from the PRODUCTION_URL repository variable;
      locally it comes from .env. Asserting on it belongs in the post-deploy smoke run,
      because it is a property of the deployment rather than of the code.
    -->

    <title>Rick &amp; Morty Character Explorer</title>
    <meta
      name="description"
      content="Browse Rick and Morty characters with status, species, origin, and episode details from the Rick and Morty API."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Rick &amp; Morty Character Explorer" />

    <!-- Opens the TLS connection to the API before any JavaScript asks for it, which
         removes DNS + TCP + TLS from the critical path of the first request.
         `crossorigin` is required: the API is fetched with CORS, and a preconnect
         without it warms the wrong connection and is silently wasted. -->
    <link rel="preconnect" href="https://rickandmortyapi.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rick &amp; Morty Character Explorer" />
    <meta property="og:title" content="Rick &amp; Morty Character Explorer" />
    <meta
      property="og:description"
      content="Browse Rick and Morty characters with status, species, origin, and episode details from the Rick and Morty API."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%VITE_SITE_URL%/fav/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Rick &amp; Morty Character Explorer app icon" />

    <!-- `summary` rather than `summary_large_image`: the image is a square 512px icon,
         and a large-image card would upscale and crop it into something worse. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rick &amp; Morty Character Explorer" />
    <meta
      name="twitter:description"
      content="Browse Rick and Morty characters with status, species, origin, and episode details from the Rick and Morty API."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/fav/web-app-manifest-512x512.png" />
    <meta name="twitter:image:alt" content="Rick &amp; Morty Character Explorer app icon" />

    <meta name="theme-color" content="#aa3bff" />
    <link rel="manifest" href="/fav/site.webmanifest" />

    <link rel="icon" type="image/svg+xml" href="/fav/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/fav/favicon-96x96.png" />
    <link rel="shortcut icon" href="/fav/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/fav/apple-touch-icon.png" />
  </head>

  <body>
    <!-- The only server-rendered element. Everything else is mounted by src/main.tsx.
         Note for deployment: this file must also be served for unknown paths, or a hard
         refresh on /character/42 returns a real 404. See docs/adr/0005-routing-strategy.md. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
